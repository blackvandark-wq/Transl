<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arzt-Sätze</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1b2430; --muted:#657083; --accent:#0a7d6e; --line:#dde3ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171d; --card:#1c242d; --ink:#eef2f6; --muted:#97a3b3; --accent:#3fc5b1; --line:#2c3743; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  h1 { font-size:18px; margin:0 0 12px; }
  .row { display:flex; gap:10px; }
  label { flex:1; font-size:12px; color:var(--muted); display:block; min-width:0; }
  select { width:100%; margin-top:4px; padding:10px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  #status { font-size:13px; color:var(--muted); margin-top:10px; }
  main { padding:16px 16px 260px; display:grid; gap:10px; max-width:640px; margin:0 auto; }
  .phrase { text-align:left; padding:16px; font-size:18px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .phrase:active { transform:scale(.98); }
  #sheet { position:fixed; inset:auto 0 0 0; background:var(--card); border-top:2px solid var(--accent); padding:20px 20px 28px; border-radius:20px 20px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.2); transform:translateY(110%); transition:transform .25s; z-index:5; }
  #sheet.open { transform:none; }
  #src { color:var(--muted); font-size:14px; }
  #dst { font-size:28px; font-weight:600; margin:8px 0 16px; }
  .actions { display:flex; gap:10px; }
  .actions button { flex:1; padding:14px; font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  .actions .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  small.warn { display:block; color:#b45309; margin-top:10px; }
  [hidden] { display:none !important; }
  .tabs { display:flex; gap:8px; margin-top:12px; }
  .tab { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:15px; cursor:pointer; }
  .tab.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #builder { padding:8px 16px 260px; max-width:640px; margin:0 auto; }
  #builder h2 { font-size:14px; margin:20px 0 8px; color:var(--muted); font-weight:600; }
  #builder h3 { font-size:12px; margin:12px 0 6px; color:var(--muted); font-weight:400; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px; cursor:pointer; }
  .chip.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip:disabled { opacity:.35; cursor:not-allowed; }
  #bnote { font-size:13px; color:#b45309; margin:12px 0 0; }
  #bar { position:fixed; inset:auto 0 0 0; background:var(--card); border-top:2px solid var(--accent); padding:14px 16px 22px; z-index:4; }
  #bsrc { color:var(--muted); font-size:14px; min-height:20px; }
  #bdst { font-size:22px; font-weight:600; margin:6px 0 12px; min-height:30px; }
</style>
</head>
<body>
<header>
  <h1>🩺 Arzt-Sätze</h1>
  <div class="row">
    <label>Meine Sprache
      <select id="srcLang"></select>
    </label>
    <label>Zielsprache
      <select id="dstLang"></select>
    </label>
  </div>
  <div id="status">Standort wird ermittelt …</div>
  <div class="tabs">
    <button class="tab on" id="tabQuick">Schnellsätze</button>
    <button class="tab" id="tabBuild">Satzbaukasten</button>
  </div>
</header>
<main id="list"></main>

<section id="builder" hidden>
  <div id="bnote" hidden></div>
  <h2>1 · Wer?</h2><div class="chips" id="gP"></div>
  <h2>2 · Was für eine Beschwerde?</h2>
  <h3>Mit Körperteil</h3><div class="chips" id="gSL"></div>
  <h3>Allgemein</h3><div class="chips" id="gSG"></div>
  <h2>3 · Wo? <span style="font-weight:400">(nur bei Beschwerden mit Körperteil)</span></h2><div class="chips" id="gB"></div>
  <h2>4 · Seit wann? <span style="font-weight:400">(optional)</span></h2><div class="chips" id="gD"></div>
</section>
<div id="bar" hidden>
  <div id="bsrc"></div>
  <div id="bdst"></div>
  <div class="actions">
    <button class="primary" id="bspeak">🔊 Sprechen</button>
    <button id="breset">Zurücksetzen</button>
  </div>
</div>

<div id="sheet" role="dialog" aria-live="polite">
  <div id="src"></div>
  <div id="dst"></div>
  <div class="actions">
    <button class="primary" id="replay">🔊 Nochmal sprechen</button>
    <button id="close">Schließen</button>
  </div>
  <small class="warn" id="warn" hidden></small>
</div>

// ---------- State ----------
const $ = id => document.getElementById(id);
const srcSel=$("srcLang"), dstSel=$("dstLang");
const store = { get:(k,d)=>{try{return localStorage.getItem(k)||d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };

// Dropdowns alphabetisch nach deutschem Namen
const CODES = Object.keys(LANGS).sort((a,b)=>LANGS[a].de.localeCompare(LANGS[b].de,"de"));
const label = c => LANGS[c].de===LANGS[c].n ? LANGS[c].n : `${LANGS[c].de} – ${LANGS[c].n}`;
CODES.forEach(c=>{ srcSel.add(new Option(label(c),c)); dstSel.add(new Option(label(c),c)); });
srcSel.value = LANGS[store.get("src","de")] ? store.get("src","de") : "de";
dstSel.value = LANGS[store.get("dst","en")] ? store.get("dst","en") : "en";

function renderList(){
  $("list").innerHTML = "";
  const L = LANGS[srcSel.value];
  $("list").dir = L.rtl ? "rtl" : "ltr";
  LANGS[srcSel.value].p.forEach((text,idx)=>{
    const b = document.createElement("button");
    b.className="phrase"; b.textContent=text;
    b.onclick=()=>show(idx);
    $("list").appendChild(b);
  });
}
let current = null;

function show(idx){
  current = idx;
  const S=LANGS[srcSel.value], D=LANGS[dstSel.value];
  $("src").textContent = S.p[idx];
  $("src").dir = S.rtl ? "rtl" : "ltr";
  $("dst").textContent = D.p[idx];
  $("dst").dir = D.rtl ? "rtl" : "ltr";
  $("sheet").classList.add("open");
  speak(D.p[idx], D);
}

// ---------- Sprachausgabe ----------
function speak(text, L){
  const warn=$("warn"); warn.hidden=true;
  if(!("speechSynthesis" in window)){ warn.textContent="Sprachausgabe wird von diesem Gerät nicht unterstützt."; warn.hidden=false; return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = L.v; u.rate = 0.85;
  const voices = speechSynthesis.getVoices();
  const norm = x => x.lang.replace("_","-").toLowerCase();
  const prefixes = (L.alt || [L.v.slice(0,2)]).map(s=>s.toLowerCase());
  const v = voices.find(x=>norm(x)===L.v.toLowerCase()) || voices.find(x=>prefixes.some(p=>norm(x).startsWith(p)));
  if(v) u.voice = v;
  else if(voices.length){ warn.textContent=`Für ${L.de} ist auf diesem Gerät keine Stimme installiert. Bitte in den Geräte-Einstellungen (Sprachausgabe) nachinstallieren – oder dem Arzt den Text auf dem Bildschirm zeigen.`; warn.hidden=false; }
  speechSynthesis.speak(u);
}
$("replay").onclick=()=>{ if(current!==null) show(current); };
$("close").onclick=()=>{ $("sheet").classList.remove("open"); speechSynthesis.cancel(); };

const cap = (s, code) => {
  const c = s.charAt(0);
  return (code === "el" && EL_UP[c] ? EL_UP[c] : c.toLocaleUpperCase(LANGS[code].v)) + s.slice(1);
};
function compose(code, sel){
  const X = BUILDER[code];
  if (!X || sel.p === null || sel.s === null) return "";
  const sid = SYM_IDS[sel.s];
  const c = { p:X.P[sel.p], s:X.S[sel.s], sid,
              b:(LOCSYM.includes(sid) && sel.b !== null) ? X.B[sel.b] : null,
              d:sel.d !== null ? X.D[sel.d] : null };
  return cap(X.f(c), code);
}
// BUILDER-END

const bsel = { p:null, s:null, b:null, d:null };
let mode = "quick";

function chip(parent, text, selected, disabled, onClick){
  const b = document.createElement("button");
  b.className = "chip" + (selected ? " sel" : ""); b.textContent = text; b.disabled = !!disabled;
  b.onclick = onClick; parent.appendChild(b);
}
function renderBuilder(){
  const sc = BUILDER[srcSel.value] ? srcSel.value : "de";
  const X = BUILDER[sc];
  const note = $("bnote"), msgs = [];
  if (!BUILDER[srcSel.value]) msgs.push(`Der Satzbaukasten ist für ${LANGS[srcSel.value].de} noch nicht verfügbar – die Auswahl erscheint auf Deutsch.`);
  if (!BUILDER[dstSel.value]) msgs.push(`Für die Zielsprache ${LANGS[dstSel.value].de} gibt es noch keinen Satzbaukasten. Bitte eine andere Zielsprache wählen (verfügbar: ${Object.keys(BUILDER).map(k=>LANGS[k].de).join(", ")}).`);
  note.hidden = !msgs.length; note.textContent = msgs.join(" ");
  for (const id of ["gP","gSL","gSG","gB","gD"]) $(id).innerHTML = "";
  X.P.forEach((p,i)=>chip($("gP"), p[0], bsel.p===i, false, ()=>{ bsel.p = i; renderBuilder(); }));
  const symChips = (ids, target) => ids
    .map(id=>SYM_IDS.indexOf(id))
    .sort((a,b)=>X.S[a][0].localeCompare(X.S[b][0], sc))
    .forEach(i=>chip(target, X.S[i][0], bsel.s===i, false, ()=>{ bsel.s = i; renderBuilder(); }));
  symChips(LOCSYM, $("gSL")); symChips(GENSYM, $("gSG"));
  const located = bsel.s !== null && LOCSYM.includes(SYM_IDS[bsel.s]);
  X.B.map((b,i)=>i).sort((a,b)=>X.B[a][0].localeCompare(X.B[b][0], sc))
    .forEach(i=>chip($("gB"), X.B[i][0], located && bsel.b===i, !located, ()=>{ bsel.b = bsel.b===i ? null : i; renderBuilder(); }));
  X.D.forEach((d,i)=>chip($("gD"), cap(d, sc), bsel.d===i, false, ()=>{ bsel.d = bsel.d===i ? null : i; renderBuilder(); }));
  updatePreview();
}
function updatePreview(){
  const sc = BUILDER[srcSel.value] ? srcSel.value : "de";
  const src = compose(sc, bsel);
  const dst = BUILDER[dstSel.value] ? compose(dstSel.value, bsel) : "";
  $("bsrc").textContent = src || "Wähle Person und Beschwerde …";
  $("bdst").textContent = dst;
  $("bspeak").disabled = !dst;
}
$("bspeak").onclick = () => { const t = $("bdst").textContent; if (t) speak(t, LANGS[dstSel.value]); };
$("breset").onclick = () => { bsel.p = bsel.s = bsel.b = bsel.d = null; speechSynthesis.cancel(); renderBuilder(); };
function setMode(m){
  mode = m;
  $("tabQuick").classList.toggle("on", m==="quick"); $("tabBuild").classList.toggle("on", m==="build");
  $("list").hidden = m!=="quick"; $("builder").hidden = m!=="build"; $("bar").hidden = m!=="build";
  $("sheet").classList.remove("open"); speechSynthesis.cancel();
  if (m==="build") renderBuilder();
}
$("tabQuick").onclick = () => setMode("quick");
$("tabBuild").onclick = () => setMode("build");

// ---------- Standort ----------
function setStatus(t){ $("status").textContent=t; }
function detect(){
  if(!navigator.geolocation){ setStatus("Kein Standortzugriff – Zielsprache bitte manuell wählen."); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const {latitude:la, longitude:lo} = pos.coords;
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=de`);
      const j = await r.json();
      const lang = COUNTRY_LANG[j.countryCode];
      if(lang){ dstSel.value=lang; store.set("dst",lang); if(mode==="build") renderBuilder(); setStatus(`Standort: ${j.countryName} → ${LANGS[lang].de}`); }
      else setStatus(`Standort: ${j.countryName} – Sprache nicht hinterlegt, bitte manuell wählen.`);
    }catch(e){ setStatus("Land konnte nicht bestimmt werden (offline?) – Zielsprache manuell wählen."); }
  }, ()=>setStatus("Standort nicht freigegeben – Zielsprache manuell wählen."), {timeout:8000, maximumAge:3600000});
}

srcSel.onchange=()=>{ store.set("src",srcSel.value); renderList(); if(mode==="build") renderBuilder(); };
dstSel.onchange=()=>{ store.set("dst",dstSel.value); setStatus("Zielsprache manuell gewählt."); if(mode==="build") renderBuilder(); };
if("speechSynthesis" in window) speechSynthesis.getVoices();
renderList(); detect();
